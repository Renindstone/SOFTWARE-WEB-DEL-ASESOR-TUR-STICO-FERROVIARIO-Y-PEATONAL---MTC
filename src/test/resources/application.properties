# ==========================================================================
# Perfil de pruebas (seccion 8: Plan de pruebas y calidad).
#
# La suite debe poder ejecutarse en cualquier maquina del equipo y en la
# integracion continua sin depender del contenedor PostgreSQL. Por eso las
# pruebas usan H2 en modo de compatibilidad PostgreSQL y Hibernate genera el
# esquema desde las propias entidades: asi la prueba de contexto verifica que
# el mapeo JPA es coherente, mientras que en ejecucion real el esquema lo
# sigue creando init/01_esquema.sql sobre PostgreSQL 15.
# ==========================================================================
spring.datasource.url=jdbc:h2:mem:asesor_mtc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Las tareas @Scheduled no deben dispararse durante las pruebas.
spring.task.scheduling.enabled=false

# Mocks del Sprint 0: en pruebas nunca se llega a la red.
integracion.perurail.base-url=http://localhost:9081/mock/perurail
integracion.senamhi.base-url=http://localhost:9082/mock/senamhi

logging.level.org.hibernate.orm.deprecation=ERROR
