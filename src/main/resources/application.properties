spring.application.name=asesor-turistico-mtc

# ------------------------------------------------------------------
# Perfil de desarrollo local: conecta al contenedor postgres-mtc
# publicado en el puerto no estandar 5440 (ver docker-compose.yml).
# ------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5440/bd_asesor_turistico
spring.datasource.username=admin_mtc
spring.datasource.password=mtc2026
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema (01_esquema.sql) y los datos (02_datos.sql) los crea el
# entrypoint de Docker; la app solo valida que coincidan con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Preserva el prefijo/casing exacto de las columnas (EstIdEstacion, ZonNombre, ...)
# definido en el diccionario de datos (seccion 6.3/6.4 del documento).
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# RNF-01: las consultas de zonas, rutas e informes resuelven sus asociaciones
# dentro de la capa de servicio (fetch joins), no de forma perezosa en la
# vista; desactivar open-in-view evita consultas sueltas durante el render.
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# ------------------------------------------------------------------
# Arquitectura fisica (seccion 5.2): la aplicacion se publica en el
# puerto no estandar 8082, para no chocar con otros servicios del
# entorno de desarrollo.
# ------------------------------------------------------------------
server.port=8082

# ------------------------------------------------------------------
# Integraciones externas (mocks desde Sprint 0; reemplazar por las URLs
# reales de PeruRail/SENAMHI cuando esten disponibles).
# ------------------------------------------------------------------
integracion.perurail.base-url=http://localhost:9081/mock/perurail
integracion.senamhi.base-url=http://localhost:9082/mock/senamhi
# RNF-03: sincronizacion diaria de frecuencias/tarifas y del pronostico.
integracion.perurail.cron=0 0 3 * * *
integracion.senamhi.cron=0 0 4 * * *

# RNF-01 / RNF-08: pool de conexiones dimensionado para la concurrencia de
# turistas generando informes a la vez. Con un pool menor que las peticiones
# simultaneas, las que no consiguen conexion fallan por timeout en vez de
# responder, aunque el control de aforo sea correcto.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
