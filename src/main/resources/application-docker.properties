# Perfil activo dentro del contenedor de aplicacion (Sprint 4), cuando
# app-mtc corre en la misma red Docker (red-mtc) que postgres-mtc.
# Las credenciales llegan por variables de entorno del docker-compose.yml.
spring.datasource.url=jdbc:postgresql://postgres-mtc:5432/bd_asesor_turistico
spring.datasource.username=admin_mtc
spring.datasource.password=mtc2026

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false
spring.thymeleaf.cache=true

# Arquitectura fisica (seccion 5.2): Tomcat embebido en el puerto 8082.
server.port=8082

# Dentro de la red de contenedores, los mocks de PeruRail y SENAMHI se
# resuelven por nombre de servicio en vez de localhost.
integracion.perurail.base-url=${INTEGRACION_PERURAIL_BASE_URL:http://mock-perurail:9081/mock/perurail}
integracion.senamhi.base-url=${INTEGRACION_SENAMHI_BASE_URL:http://mock-senamhi:9082/mock/senamhi}

# RNF-01 / RNF-08: pool de conexiones dimensionado para la concurrencia de
# turistas generando informes a la vez. Con un pool menor que las peticiones
# simultaneas, las que no consiguen conexion fallan por timeout en vez de
# responder, aunque el control de aforo sea correcto.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
