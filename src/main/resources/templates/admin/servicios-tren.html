<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horarios y tarifas - MTC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">

  <style>
    body{
      font-family:'Manrope', system-ui, sans-serif;
      background:#F6F4EF;
    }

    .page-title{ color:#14453D; letter-spacing:-0.01em; }
    .page-sub{ color:#6B7568; }

    .section-card{
      border:none;
      border-radius:16px;
      border-top:4px solid #C89B3C;
      box-shadow:0 14px 32px -14px rgba(20,69,61,.20);
    }

    .section-title{
      font-weight:700;
      color:#14453D;
      display:flex;
      align-items:center;
      gap:.5rem;
    }
    .section-title i{ color:#C89B3C; }

    .table-mtc thead{ background:#14453D; color:#fff; }
    .table-mtc thead th{ font-weight:600; font-size:.82rem; border:none; white-space:nowrap; }
    .table-mtc tbody td{ vertical-align:middle; font-size:.88rem; }
    .table-mtc tbody tr:hover{ background:#FBF8F1; }

    .route-cell{ display:flex; align-items:center; gap:.4rem; font-weight:600; color:#14453D; }
    .route-cell i{ color:#C89B3C; font-size:.85rem; }

    .fare-pill{
      background:#E4F2E9;
      color:#1F6B45;
      font-weight:700;
      border-radius:20px;
      padding:.25rem .75rem;
      font-size:.85rem;
      display:inline-block;
    }

    .form-select, .form-control{
      border:1.5px solid #DEDCD2;
      border-radius:9px;
      padding-block:.55rem;
    }
    .form-select:focus, .form-control:focus{
      border-color:#14453D;
      box-shadow:0 0 0 3px rgba(20,69,61,.10);
    }
    .form-label{ font-size:.82rem; font-weight:600; color:#14453D; margin-bottom:.3rem; }

    .btn-mtc{
      background:#14453D;
      color:#fff;
      border:none;
      border-radius:9px;
      font-weight:700;
      padding:.6rem 1.6rem;
    }
    .btn-mtc:hover{ background:#0D302A; color:#fff; }
  </style>
</head>
<body>
<div th:replace="~{layout/nav :: nav}"></div>

<main class="container py-4" style="max-width: 1100px;">

  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <div>
      <h1 class="h4 fw-bold page-title mb-1">Horarios y tarifas</h1>
      <p class="page-sub mb-0">Mantenimiento de servicios de tren entre estaciones.</p>
    </div>
    <button type="button" class="btn btn-mtc" data-bs-toggle="modal" data-bs-target="#modalServicio">
      <i class="bi bi-plus-lg me-2"></i>Nuevo servicio
    </button>
  </div>

  <div class="modal fade" id="modalServicio" tabindex="-1" aria-labelledby="modalServicioLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content" style="border:none; border-radius:16px; border-top:4px solid #C89B3C; overflow:hidden;">

        <div class="modal-header" style="border-bottom:1px solid #E5E2D8;">
          <div>
            <h1 class="modal-title h5 fw-bold mb-1" id="modalServicioLabel" style="color:#14453D;">Nuevo servicio</h1>
            <p class="mb-0" style="color:#6B7568; font-size:.88rem;">Registra un horario y tarifa entre dos estaciones.</p>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body p-4 p-md-5">
          <form method="post" th:action="@{/servicios-tren}" th:object="${servicioTren}" class="row g-3" id="formServicio">
            <div class="col-md-6">
              <label class="form-label">Estación origen</label>
              <select class="form-select" th:field="*{estacionOrigen}">
                <option th:each="est : ${estaciones}" th:value="${est.Id}" th:text="${est.Nombre}"></option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Estación destino</label>
              <select class="form-select" th:field="*{estacionDestino}">
                <option th:each="est : ${estaciones}" th:value="${est.Id}" th:text="${est.Nombre}"></option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Salida</label>
              <input type="time" class="form-control" th:field="*{HorarioSalida}">
            </div>
            <div class="col-md-3">
              <label class="form-label">Llegada</label>
              <input type="time" class="form-control" th:field="*{HorarioLlegada}">
            </div>
            <div class="col-md-3">
              <label class="form-label">Tránsito (min)</label>
              <input type="number" class="form-control" th:field="*{TiempoTransitoMin}">
            </div>
            <div class="col-md-3">
              <label class="form-label">Tarifa (S/)</label>
              <input type="number" step="0.01" class="form-control" th:field="*{Tarifa}">
            </div>
          </form>
        </div>

        <div class="modal-footer" style="border-top:1px solid #E5E2D8;">
          <button type="button" class="btn" data-bs-dismiss="modal"
                  style="border:1.5px solid #DEDCD2; color:#6B7568; border-radius:9px; font-weight:600; padding:.65rem 1.5rem; background:#fff;">
            Cancelar
          </button>
          <button type="submit" form="formServicio" class="btn btn-mtc">
            <i class="bi bi-check2 me-2"></i>Guardar
          </button>
        </div>

      </div>
    </div>
  </div>

  <div class="card section-card">
    <div class="card-body p-4">
      <h2 class="h6 section-title mb-3"><i class="bi bi-clock-history"></i> Servicios activos</h2>

      <div class="table-responsive">
        <table class="table table-mtc table-sm mb-0">
          <thead>
            <tr>
              <th>Origen</th>
              <th>Destino</th>
              <th>Salida</th>
              <th>Llegada</th>
              <th>Tránsito</th>
              <th>Tarifa</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="serv : ${servicios}">
              <td>
                <span class="route-cell">
                  <i class="bi bi-geo-alt-fill"></i>
                  <span th:text="${serv.estacionOrigen.Nombre}"></span>
                </span>
              </td>
              <td>
                <span class="route-cell">
                  <i class="bi bi-geo-alt-fill"></i>
                  <span th:text="${serv.estacionDestino.Nombre}"></span>
                </span>
              </td>
              <td th:text="${serv.HorarioSalida}"></td>
              <td th:text="${serv.HorarioLlegada}"></td>
              <td th:text="${serv.TiempoTransitoMin} + ' min'"></td>
              <td><span class="fare-pill" th:text="'S/ ' + ${serv.Tarifa}"></span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<div th:replace="~{layout/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
