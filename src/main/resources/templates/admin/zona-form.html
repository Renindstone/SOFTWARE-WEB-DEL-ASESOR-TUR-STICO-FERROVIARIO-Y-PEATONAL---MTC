<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva zona turística - MTC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{layout/nav :: nav}"></div>
<main class="container">
  <h1 class="h4 mb-3">Registrar/actualizar zona turística (RF-10/RF-17)</h1>
  <form method="post" th:action="@{/admin/zonas}" th:object="${zona}">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" th:field="*{zonNombre}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea class="form-control" th:field="*{zonDescripcion}"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Estación cercana</label>
      <select class="form-select" th:field="*{estacionCercana}">
        <option th:each="est : ${estaciones}" th:value="${est.estIdEstacion}" th:text="${est.estNombre}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Costo aproximado</label>
      <input type="number" step="0.01" class="form-control" th:field="*{zonCostoAprox}">
    </div>
    <div class="mb-3">
      <label class="form-label">Cupo máximo diario (RF-17, opcional)</label>
      <input type="number" class="form-control" th:field="*{zonCupoMaximoDiario}">
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </form>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
