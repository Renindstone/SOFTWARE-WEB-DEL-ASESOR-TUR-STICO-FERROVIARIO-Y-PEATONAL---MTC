<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auditoría - MTC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">

  <style>
    body{
      font-family:'Manrope', system-ui, sans-serif;
      background:#F6F4EF;
    }

    .page-title{ color:#14453D; letter-spacing:-0.01em; }
    .page-sub{ color:#6B7568; }

    .section-card{
      border:none;
      border-radius:16px;
      border-top:4px solid #C89B3C;
      box-shadow:0 14px 32px -14px rgba(20,69,61,.20);
    }

    .filter-bar{
      background:#fff;
      border:1.5px solid #DEDCD2;
      border-radius:12px;
      padding:.9rem 1.1rem;
    }
    .filter-bar .form-control, .filter-bar .form-select{
      border:1.5px solid #DEDCD2;
      border-radius:8px;
    }
    .filter-bar .form-control:focus, .filter-bar .form-select:focus{
      border-color:#14453D;
      box-shadow:0 0 0 3px rgba(20,69,61,.10);
    }

    .table-mtc thead{ background:#14453D; color:#fff; }
    .table-mtc thead th{ font-weight:600; font-size:.82rem; border:none; white-space:nowrap; }
    .table-mtc tbody td{ vertical-align:middle; font-size:.85rem; }
    .table-mtc tbody tr:hover{ background:#FBF8F1; }

    .badge-op-insert{ background:#E4F2E9; color:#1F6B45; }
    .badge-op-update{ background:#FBF1DD; color:#A67C2E; }
    .badge-op-delete{ background:#FBE8E6; color:#B3382C; }

    .val-cell{
      font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size:.78rem;
      color:#4A5348;
      max-width:220px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .user-chip{
      display:inline-flex;
      align-items:center;
      gap:.4rem;
      font-weight:600;
      color:#14453D;
    }
    .user-chip i{ color:#C89B3C; }

    .btn-mtc-outline{
      border:1.5px solid #14453D;
      color:#14453D;
      border-radius:8px;
      font-weight:600;
      background:#fff;
    }
    .btn-mtc-outline:hover{ background:#14453D; color:#fff; }
  </style>
</head>
<body>
<div th:replace="~{layout/nav :: nav}"></div>

<main class="container py-4" style="max-width: 1100px;">

  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <div>
      <h1 class="h4 fw-bold page-title mb-1">Log de auditoría</h1>
      <p class="page-sub mb-0">Historial de operaciones realizadas sobre el sistema.</p>
    </div>
    <button type="button" class="btn btn-mtc-outline">
      <i class="bi bi-download me-2"></i>Exportar
    </button>
  </div>

  <div class="filter-bar mb-3">
    <div class="row g-2 align-items-center">
      <div class="col-12 col-md-3">
        <input type="date" class="form-control form-control-sm" placeholder="Fecha">
      </div>
      <div class="col-12 col-md-3">
        <input type="text" class="form-control form-control-sm" placeholder="Buscar usuario">
      </div>
      <div class="col-12 col-md-3">
        <select class="form-select form-select-sm">
          <option value="">Todas las operaciones</option>
          <option value="INSERT">INSERT</option>
          <option value="UPDATE">UPDATE</option>
          <option value="DELETE">DELETE</option>
        </select>
      </div>
      <div class="col-12 col-md-3">
        <select class="form-select form-select-sm">
          <option value="">Todas las tablas</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card section-card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-mtc table-sm mb-0">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Usuario</th>
              <th>Operación</th>
              <th>Tabla</th>
              <th>Valor anterior</th>
              <th>Valor nuevo</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="log : ${registros}">
              <td th:text="${log.Fecha}"></td>
              <td>
                <span class="user-chip">
                  <i class="bi bi-person-circle"></i>
                  <span th:text="${log.Usuario}"></span>
                </span>
              </td>
              <td>
                <span class="badge"
                      th:classappend="${log.Operacion == 'INSERT'} ? 'badge-op-insert' : (${log.Operacion == 'DELETE'} ? 'badge-op-delete' : 'badge-op-update')"
                      th:text="${log.Operacion}"></span>
              </td>
              <td th:text="${log.TablaAfectada}"></td>
              <td class="val-cell" th:text="${log.ValorAnterior}" th:title="${log.ValorAnterior}"></td>
              <td class="val-cell" th:text="${log.ValorNuevo}" th:title="${log.ValorNuevo}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
