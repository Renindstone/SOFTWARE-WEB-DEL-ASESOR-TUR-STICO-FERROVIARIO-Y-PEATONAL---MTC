<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Auditoría - MTC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{layout/nav :: nav}"></div>
<main class="container">
  <h1 class="h4 mb-3">Log de auditoría (RF-15/RNF-07)</h1>
  <table class="table table-sm table-striped">
    <thead><tr><th>Fecha</th><th>Usuario</th><th>Operación</th><th>Tabla</th><th>Valor anterior</th><th>Valor nuevo</th></tr></thead>
    <tbody>
      <tr th:each="log : ${registros}">
        <td th:text="${log.audFecha}"></td>
        <td th:text="${log.audUsuario}"></td>
        <td th:text="${log.audOperacion}"></td>
        <td th:text="${log.audTablaAfectada}"></td>
        <td th:text="${log.audValorAnterior}"></td>
        <td th:text="${log.audValorNuevo}"></td>
      </tr>
    </tbody>
  </table>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
