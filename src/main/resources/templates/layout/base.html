<!DOCTYPE html>
<!--
  Fragmento de referencia (no se usa como pagina propia): cada vista concreta
  copia esta cabecera y hace th:insert="layout/nav :: nav" / "layout/footer :: footer".
  No se usa thymeleaf-layout-dialect porque no esta en el pom.xml del proyecto.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:fragment="head(titulo)" th:text="${titulo} + ' - MTC'">Asesor Turístico MTC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
  <div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script th:src="@{/js/mapa-leaflet.js}"></script>
  </div>
</body>
</html>
