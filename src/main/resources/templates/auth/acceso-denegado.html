<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{layout/base :: head('Acceso denegado')}"></head>

<body>
<div th:replace="~{layout/nav :: nav}"></div>

<!-- HURF06 / CN-08: rol autenticado sin permiso sobre el módulo solicitado. -->
<main class="container py-5" style="max-width: 620px;">
  <div class="card section-card">
    <div class="card-body text-center p-4 p-md-5">
      <i class="bi bi-shield-lock fs-1" style="color:#B3382C;"></i>
      <h1 class="h4 fw-bold page-title mt-3 mb-2">Acceso denegado (403)</h1>
      <p class="page-sub mb-1">Tu rol no tiene permisos para acceder a este módulo.</p>
      <p class="small page-sub">
        Si necesitas este acceso, solicítalo al administrador del MTC.
      </p>
      <div class="d-flex gap-2 justify-content-center mt-3">
        <a th:href="@{/preferencias}" class="btn btn-mtc btn-sm">Ir al panel del turista</a>
        <a th:href="@{/}" class="btn btn-mtc-outline btn-sm">Ir al inicio</a>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>

</html>
