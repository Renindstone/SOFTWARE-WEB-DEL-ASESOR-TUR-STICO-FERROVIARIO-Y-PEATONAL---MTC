<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Informe consolidado - MTC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{layout/nav :: nav}"></div>
<main class="container">
  <h1 class="h4 mb-3">Informe consolidado de tu visita (RF-08)</h1>
  <p><strong>Código:</strong> <span th:text="${informe.codigo}"></span></p>
  <ul class="list-group mb-3">
    <li class="list-group-item">Fecha de visita: <span th:text="${informe.fechaVisita}"></span></li>
    <li class="list-group-item">Estación de origen: <span th:text="${informe.estacionOrigen}"></span></li>
    <li class="list-group-item">Zona turística: <span th:text="${informe.zonaDestino}"></span></li>
    <li class="list-group-item">Distancia (ida y vuelta): <span th:text="${informe.ruta.distanciaKm} + ' km'"></span></li>
    <li class="list-group-item">Tiempo estimado: <span th:text="${informe.ruta.tiempoEstimadoMin} + ' min'"></span></li>
    <li class="list-group-item">Dificultad: <span th:text="${informe.ruta.dificultad}"></span></li>
    <li class="list-group-item">Clima previsto: <span th:text="${informe.temperaturaMinimaC} + ' - ' + ${informe.temperaturaMaximaC} + '°C, ' + ${informe.probabilidadLluvia} + '% lluvia (' + ${informe.estadoClima} + ')'"></span></li>
    <li class="list-group-item">Tarifa del tren: <span th:text="${informe.tarifaTren}"></span></li>
    <li class="list-group-item"><strong>Total estimado: <span th:text="${informe.totalEstimado}"></span></strong></li>
  </ul>
  <a class="btn btn-outline-secondary" href="#" onclick="window.print(); return false;">Descargar / imprimir (HTML)</a>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
