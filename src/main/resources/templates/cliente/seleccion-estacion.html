<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{layout/base :: head('Estaciones disponibles')}"></head>

<body>
<div th:replace="~{layout/nav :: nav}"></div>

<main class="container py-4" style="max-width: 760px;">

  <div class="mb-4">
    <h1 class="h4 fw-bold page-title mb-1">¿Desde qué estación viajas?</h1>
    <!-- RF-02 (CN-02): las estaciones inactivas no llegan a este listado. -->
    <p class="page-sub mb-0">Solo se muestran las estaciones activas de la red de PeruRail.</p>
  </div>

  <div class="list-group">
    <a th:each="est : ${estaciones}" class="list-group-item list-group-item-action d-flex
       justify-content-between align-items-center"
       th:href="@{/preferencias(idEstacionOrigen=${est.id})}">
      <span class="est-name">
        <i class="bi bi-train-front"></i>
        <span th:text="${est.nombre}">Estación</span>
      </span>
      <span class="small page-sub" th:text="${est.ciudad}">Ciudad</span>
    </a>
  </div>

  <p class="page-sub small mt-3 mb-0" th:if="${#lists.isEmpty(estaciones)}">
    No hay estaciones activas registradas. La sincronización con PeruRail aún no ha traído datos.
  </p>

</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>

</html>
