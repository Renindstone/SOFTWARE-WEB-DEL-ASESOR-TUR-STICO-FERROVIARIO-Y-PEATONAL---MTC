<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zonas turísticas recomendadas - MTC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{layout/nav :: nav}"></div>
<main class="container">
  <h1 class="h4 mb-3">Zonas turísticas cercanas (RF-03)</h1>
  <div class="row g-3" th:if="${not #lists.isEmpty(zonas)}">
    <div class="col-md-4" th:each="zona : ${zonas}">
      <div class="card h-100">
        <div class="card-body">
          <h2 class="h6 card-title" th:text="${zona.nombre}"></h2>
          <p class="card-text small" th:text="${zona.descripcion}"></p>
          <p class="small text-muted" th:text="${#strings.listJoin(zona.tiposTurismo, ', ')}"></p>
          <a class="btn btn-sm btn-outline-primary"
             th:href="@{/rutas/detalle(idEstacion=${zona.idEstacionCercana}, idZona=${zona.idZona})}">
             Ver ruta a pie
          </a>
        </div>
      </div>
    </div>
  </div>
  <p th:if="${#lists.isEmpty(zonas)}">No se encontraron zonas turísticas para tus preferencias.</p>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
