<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Selecciona tu estación - MTC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{layout/nav :: nav}"></div>
<main class="container">
  <h1 class="h4 mb-3">Estaciones disponibles (RF-02)</h1>
  <div class="list-group">
    <a th:each="est : ${estaciones}" class="list-group-item list-group-item-action"
       th:href="@{/preferencias(idEstacionOrigen=${est.estIdEstacion})}" th:text="${est.estNombre + ' - ' + est.estCiudad}"></a>
  </div>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
