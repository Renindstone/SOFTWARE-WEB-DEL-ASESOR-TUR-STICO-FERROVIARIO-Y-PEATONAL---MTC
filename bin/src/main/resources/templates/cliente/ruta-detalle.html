<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ruta a pie - MTC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{layout/nav :: nav}"></div>
<main class="container">
  <h1 class="h4 mb-3">Ruta de ida y vuelta (RF-04/RF-05)</h1>
  <ul class="list-group mb-3">
    <li class="list-group-item">Estación de origen: <strong th:text="${origen.estNombre}"></strong></li>
    <li class="list-group-item">Zona turística: <strong th:text="${destino.zonNombre}"></strong></li>
    <li class="list-group-item">Distancia (ida y vuelta): <strong th:text="${ruta.distanciaKm} + ' km'"></strong></li>
    <li class="list-group-item">Tiempo estimado: <strong th:text="${ruta.tiempoEstimadoMin} + ' min'"></strong></li>
    <li class="list-group-item">Dificultad: <strong th:text="${ruta.dificultad}"></strong></li>
  </ul>
  <div id="mapa-ruta" style="height: 360px;"
       th:attr="data-lat-origen=${origen.estLatitud}, data-lon-origen=${origen.estLongitud}"></div>
  <a class="btn btn-primary mt-3"
     th:href="@{/informes/consolidado(idEstacion=${origen.estIdEstacion}, idZona=${destino.zonIdZona}, fechaVisita=${T(java.time.LocalDate).now()})}">
     Generar informe consolidado
  </a>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/mapa-leaflet.js}"></script>
</body>
</html>
