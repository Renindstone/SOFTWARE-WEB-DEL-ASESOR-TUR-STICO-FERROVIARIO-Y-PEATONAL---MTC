<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!--
  Plantilla usada por GeneradorPdf (OpenPDF/iText) para renderizar el
  informe consolidado en PDF. Mantener estilos simples/imprimibles.
-->
<head>
  <meta charset="UTF-8">
  <title>Informe consolidado (PDF)</title>
  <style>
    body { font-family: Arial, sans-serif; font-size: 12px; }
    h1 { font-size: 18px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border: 1px solid #ccc; padding: 6px; text-align: left; }
  </style>
</head>
<body>
  <h1>Informe consolidado de visita - MTC</h1>
  <p><strong>Código:</strong> <span th:text="${informe.codigo}"></span></p>
  <table>
    <tr><th>Fecha de visita</th><td th:text="${informe.fechaVisita}"></td></tr>
    <tr><th>Estación de origen</th><td th:text="${informe.estacionOrigen}"></td></tr>
    <tr><th>Zona turística</th><td th:text="${informe.zonaDestino}"></td></tr>
    <tr><th>Distancia (ida y vuelta)</th><td th:text="${informe.ruta.distanciaKm} + ' km'"></td></tr>
    <tr><th>Tiempo estimado</th><td th:text="${informe.ruta.tiempoEstimadoMin} + ' min'"></td></tr>
    <tr><th>Dificultad</th><td th:text="${informe.ruta.dificultad}"></td></tr>
    <tr><th>Clima previsto</th><td th:text="${informe.temperaturaMinimaC} + ' - ' + ${informe.temperaturaMaximaC} + '°C, ' + ${informe.probabilidadLluvia} + '% lluvia'"></td></tr>
    <tr><th>Tarifa del tren</th><td th:text="${informe.tarifaTren}"></td></tr>
    <tr><th>Total estimado</th><td th:text="${informe.totalEstimado}"></td></tr>
  </table>
</body>
</html>
