<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zonas turísticas - MTC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{layout/nav :: nav}"></div>
<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Zonas turísticas (RF-10)</h1>
    <a class="btn btn-primary btn-sm" th:href="@{/admin/zonas/nueva}">Nueva zona</a>
  </div>
  <table class="table table-striped">
    <thead>
      <tr><th>Nombre</th><th>Estación cercana</th><th>Costo aprox.</th><th>Cupo máx. diario</th><th>Estado</th></tr>
    </thead>
    <tbody>
      <tr th:each="zona : ${zonas}">
        <td th:text="${zona.zonNombre}"></td>
        <td th:text="${zona.estacionCercana.estNombre}"></td>
        <td th:text="${zona.zonCostoAprox}"></td>
        <td th:text="${zona.zonCupoMaximoDiario}"></td>
        <td th:text="${zona.zonEstado}"></td>
      </tr>
    </tbody>
  </table>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
