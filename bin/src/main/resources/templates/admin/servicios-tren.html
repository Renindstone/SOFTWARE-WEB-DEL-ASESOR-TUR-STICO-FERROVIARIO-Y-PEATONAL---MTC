<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Horarios y tarifas - MTC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{layout/nav :: nav}"></div>
<main class="container">
  <h1 class="h4 mb-3">Mantenimiento de horarios y precios (RF-12)</h1>
  <table class="table table-striped mb-4">
    <thead><tr><th>Origen</th><th>Destino</th><th>Salida</th><th>Llegada</th><th>Tránsito (min)</th><th>Tarifa</th></tr></thead>
    <tbody>
      <tr th:each="serv : ${servicios}">
        <td th:text="${serv.estacionOrigen.estNombre}"></td>
        <td th:text="${serv.estacionDestino.estNombre}"></td>
        <td th:text="${serv.serHorarioSalida}"></td>
        <td th:text="${serv.serHorarioLlegada}"></td>
        <td th:text="${serv.serTiempoTransitoMin}"></td>
        <td th:text="${serv.serTarifa}"></td>
      </tr>
    </tbody>
  </table>

  <h2 class="h6">Nuevo servicio</h2>
  <form method="post" th:action="@{/admin/servicios-tren}" th:object="${servicioTren}" class="row g-2">
    <div class="col-md-3">
      <label class="form-label">Estación origen</label>
      <select class="form-select" th:field="*{estacionOrigen}">
        <option th:each="est : ${estaciones}" th:value="${est.estIdEstacion}" th:text="${est.estNombre}"></option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Estación destino</label>
      <select class="form-select" th:field="*{estacionDestino}">
        <option th:each="est : ${estaciones}" th:value="${est.estIdEstacion}" th:text="${est.estNombre}"></option>
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label">Salida</label>
      <input type="time" class="form-control" th:field="*{serHorarioSalida}">
    </div>
    <div class="col-md-2">
      <label class="form-label">Llegada</label>
      <input type="time" class="form-control" th:field="*{serHorarioLlegada}">
    </div>
    <div class="col-md-1">
      <label class="form-label">Min.</label>
      <input type="number" class="form-control" th:field="*{serTiempoTransitoMin}">
    </div>
    <div class="col-md-1">
      <label class="form-label">Tarifa</label>
      <input type="number" step="0.01" class="form-control" th:field="*{serTarifa}">
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-primary mt-2">Guardar</button>
    </div>
  </form>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
