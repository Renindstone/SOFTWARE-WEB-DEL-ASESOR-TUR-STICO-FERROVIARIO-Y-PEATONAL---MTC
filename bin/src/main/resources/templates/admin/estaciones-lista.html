<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estaciones - MTC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{layout/nav :: nav}"></div>
<main class="container">
  <h1 class="h4 mb-3">Listado de estaciones (RF-11, solo lectura)</h1>
  <table class="table table-striped">
    <thead><tr><th>Código</th><th>Nombre</th><th>Ciudad</th><th>Estado</th></tr></thead>
    <tbody>
      <tr th:each="est : ${estaciones}">
        <td th:text="${est.estCodigo}"></td>
        <td th:text="${est.estNombre}"></td>
        <td th:text="${est.estCiudad}"></td>
        <td th:text="${est.estEstado}"></td>
      </tr>
    </tbody>
  </table>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
