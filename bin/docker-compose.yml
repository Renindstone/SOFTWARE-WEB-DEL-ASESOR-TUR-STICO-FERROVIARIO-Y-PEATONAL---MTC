# ============================================================
# Proyecto : Asesor Turistico Ferroviario y Peatonal - MTC
# Curso    : Ingenieria de Software - UNU
# Contenedor de base de datos PostgreSQL 15
# Puerto no estandar 5440 para evitar conflictos con otras
# instancias de PostgreSQL del entorno de desarrollo.
# ============================================================

services:
  postgres-mtc:
    image: postgres:15
    container_name: postgres-mtc-turismo
    restart: unless-stopped
    environment:
      POSTGRES_DB: bd_asesor_turistico
      POSTGRES_USER: admin_mtc
      POSTGRES_PASSWORD: mtc2026
      TZ: America/Lima
    ports:
      - "5440:5432"
    volumes:
      - mtc_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_mtc -d bd_asesor_turistico"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red-mtc

  # ----------------------------------------------------------
  # Contenedor de aplicacion (Sprint 4 - despliegue).
  # Descomentar cuando el proyecto Spring Boot tenga Dockerfile.
  # ----------------------------------------------------------
  # app-mtc:
  #   build: .
